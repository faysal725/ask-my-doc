[project]
name = "ask-my-doc-backend"
version = "0.1.0"
description = "Hybrid RAG backend for doc Q&A — FastAPI + Qdrant + BM25 + reranker + Groq"
authors = [
    {name = "faysal725", email = "afaysal725@gmail.com"}
]
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "groq (>=1.6.0,<2.0.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "google-genai (>=2.16.0,<3.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "sentence-transformers (>=5.7.0,<6.0.0)",
    "datasets (>=2.14,<3.0)",
    "langchain-community (>=0.3.0,<0.4.0)",
    "langchain-google-genai (>=4.3.2,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "ragas (==0.2.15)"
]
